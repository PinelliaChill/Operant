[package]
name = "operant-desktop"
version = "0.1.0"
description = "Thin desktop shell for Operant"
edition = "2021"

[lib]
name = "operant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "=0.3.4"
hmac = "=0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-opener = "=2.5.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
