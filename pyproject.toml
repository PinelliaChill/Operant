[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operant-agent"
version = "0.1.0"
description = "一个由角色预设驱动的多模型 Coding Agent Runtime。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Operant contributors" }]
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "rich>=13.9,<16",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
operant = "operant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/operant"]

[tool.hatch.build.targets.wheel.force-include]
"sdk/__init__.py" = "sdk/__init__.py"
"sdk/python_client" = "sdk/python_client"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/sdk/__init__.py",
  "/sdk/python_client",
  "/src/operant",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["operant"]
