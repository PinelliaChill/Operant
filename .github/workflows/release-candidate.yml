name: Release candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Validate locked dependency graph
        run: uv lock --check --offline
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Generate and verify checksums and SPDX SBOM
        run: |
          python scripts/release_checks.py generate --dist dist
          python scripts/release_checks.py verify --dist dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/operant-release-smoke
          /tmp/operant-release-smoke/bin/pip install dist/*.whl
          /tmp/operant-release-smoke/bin/operant --help
      - name: Preserve release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: operant-python-release-candidate
          path: dist/
          if-no-files-found: error
