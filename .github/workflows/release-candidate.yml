name: Release candidate evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest
      - run: uv lock --check --offline
      - run: git diff --check
      - run: uv run --no-sync python scripts/benchmark_auth.py

  client-candidates:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: |
            clients/gui/package-lock.json
            clients/desktop/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Test and build PWA
        run: |
          npm ci --prefix clients/gui
          npm run test --prefix clients/gui
          npm run typecheck --prefix clients/gui
          npm run build --prefix clients/gui
      - name: Test, build, and install TUI wheel
        run: |
          uv sync --project clients/tui --frozen
          uv run --project clients/tui --no-sync python -m unittest discover -s clients/tui/test
          uv build clients/tui --out-dir clients/tui/dist
          python -m venv /tmp/operant-tui-smoke
          /tmp/operant-tui-smoke/bin/pip install clients/tui/dist/*.whl
          /tmp/operant-tui-smoke/bin/operant-tui --help
      - name: Test and build unsigned Tauri candidate
        run: |
          npm ci --prefix clients/desktop
          cargo test --locked --manifest-path clients/desktop/src-tauri/Cargo.toml
          npm run tauri --prefix clients/desktop -- build
      - name: Preserve unsigned client candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operant-unsigned-client-candidates-not-for-release
          path: |
            clients/gui/dist/
            clients/tui/dist/
            clients/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  python-distribution:
    needs: [quality, client-candidates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Validate locked dependency graph
        run: uv lock --check --offline
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Generate and verify checksums and SPDX SBOM
        run: |
          python scripts/release_checks.py generate --dist dist
          python scripts/release_checks.py verify --dist dist
      - name: Install wheel and source distribution in clean environments
        run: |
          python -m venv /tmp/operant-wheel-smoke
          /tmp/operant-wheel-smoke/bin/pip install dist/*.whl
          /tmp/operant-wheel-smoke/bin/operant --help
          python -m venv /tmp/operant-sdist-smoke
          /tmp/operant-sdist-smoke/bin/pip install dist/*.tar.gz
          /tmp/operant-sdist-smoke/bin/operant --help
      - name: Preserve release candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operant-python-release-candidate
          path: dist/
          if-no-files-found: error
