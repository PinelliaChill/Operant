name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      gui: ${{ steps.scope.outputs.gui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    # Always emit the existing required check names, including for documentation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: 验证范围检查成功
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        if: needs.changes.outputs.backend == 'true'
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装锁定依赖
        if: needs.changes.outputs.backend == 'true'
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: TUI定向测试
        if: needs.changes.outputs.backend == 'true'
        run: |
          uv sync --project clients/tui --frozen --python "${{ matrix.python-version }}"
          uv run --project clients/tui --no-sync python -m unittest discover -s clients/tui/test
      - name: Python检查与测试
        if: needs.changes.outputs.backend == 'true'
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy src
          uv lock --check --offline --python "${{ matrix.python-version }}"
          uv run --no-sync pytest
      - name: 无后端改动
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes; required check completed without product tests."

  gui:
    name: GUI
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 验证范围检查成功
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.changes.outputs.gui == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: needs.changes.outputs.gui == 'true'
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: clients/gui/package-lock.json
      - name: GUI测试、类型与构建
        if: needs.changes.outputs.gui == 'true'
        run: |
          npm ci --prefix clients/gui
          npm run test --prefix clients/gui
          npm run typecheck --prefix clients/gui
          npm run build --prefix clients/gui
      - name: 无GUI改动
        if: needs.changes.outputs.gui != 'true'
        run: echo "No GUI changes; check completed without frontend build."
