name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装 uv
        run: python -m pip install uv==0.12.0
      - name: 安装锁定依赖
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: 断言矩阵 Python 解释器
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run --no-sync python -c 'import os, sys; expected = os.environ["EXPECTED_PYTHON"];
          actual = f"{sys.version_info.major}.{sys.version_info.minor}"; assert actual == expected,
          f"expected Python {expected}, got {actual} ({sys.executable})"; assert sys.prefix !=
          sys.base_prefix, f"expected project venv, got {sys.executable}"; print(f"Using Python
          {actual} ({sys.executable})")'
      - name: 代码检查
        run: uv run --no-sync ruff check .
      - name: 格式检查
        run: uv run --no-sync ruff format --check .
      - name: 类型检查
        run: uv run --no-sync mypy src
      - name: 运行测试
        run: uv run --no-sync pytest
